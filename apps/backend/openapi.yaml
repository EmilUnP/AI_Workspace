openapi: 3.0.3
info:
  title: Eduator Clean Backend API
  version: 0.1.0
  description: Clean backend API contract for local PostgreSQL + JWT stack.
servers:
  - url: http://localhost:4000
    description: Local backend
tags:
  - name: Health
  - name: Auth
  - name: Users
  - name: Documents
  - name: AI
paths:
  /health:
    get:
      tags: [Health]
      summary: Health check
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                    example: true
  /v1/auth/register:
    post:
      tags: [Auth]
      summary: Register a local user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '201':
          description: Registered
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
  /v1/auth/login:
    post:
      tags: [Auth]
      summary: Login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Logged in
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
  /v1/auth/refresh:
    post:
      tags: [Auth]
      summary: Refresh tokens
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [refreshToken]
              properties:
                refreshToken:
                  type: string
      responses:
        '200':
          description: Tokens refreshed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
  /v1/auth/me:
    get:
      tags: [Auth]
      summary: Current user
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Current user
  /v1/users:
    get:
      tags: [Users]
      summary: List users
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: User list
  /v1/documents:
    post:
      tags: [Documents]
      summary: Create document metadata
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateDocumentRequest'
      responses:
        '201':
          description: Document created
    get:
      tags: [Documents]
      summary: List documents
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Document list
  /v1/documents/{id}:
    get:
      tags: [Documents]
      summary: Get document by ID
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: One document
        '404':
          description: Not found
  /v1/ai/requests:
    post:
      tags: [AI]
      summary: Create generic AI request
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [type, payload]
              properties:
                type: { type: string }
                payload: { type: object, additionalProperties: true }
      responses:
        '201':
          description: Created
  /v1/ai/requests/{id}:
    get:
      tags: [AI]
      summary: Get generic AI request by ID
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Found
        '404':
          description: Not found
  /v1/ai/rag/retrieve:
    post:
      tags: [AI]
      summary: Retrieve relevant chunks from a document
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [documentId, query]
              properties:
                documentId:
                  type: string
                  format: uuid
                query:
                  type: string
                topK:
                  type: integer
                  default: 5
      responses:
        '200':
          description: Retrieved chunks
  /v1/ai/chat/conversations:
    get:
      tags: [AI]
      summary: List chat conversations
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Conversation list
    post:
      tags: [AI]
      summary: Create chat conversation
      security: [{ bearerAuth: [] }]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                title:
                  type: string
      responses:
        '201':
          description: Created
  /v1/ai/chat/conversations/{id}/messages:
    post:
      tags: [AI]
      summary: Send a chat message
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [message]
              properties:
                message:
                  type: string
                documentIds:
                  type: array
                  items:
                    type: string
                    format: uuid
                shortAnswer:
                  type: boolean
      responses:
        '200':
          description: Assistant response
  /v1/ai/lessons/generate:
    post:
      tags: [AI]
      summary: Generate lesson from document
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [documentId, topic]
              properties:
                documentId: { type: string, format: uuid }
                topic: { type: string }
                language: { type: string, default: en }
                gradeLevel: { type: string }
                subject: { type: string }
      responses:
        '201':
          description: Generated
  /v1/ai/exams/generate:
    post:
      tags: [AI]
      summary: Generate exam
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GenerateExamRequest'
      responses:
        '201':
          description: Generated
  /v1/ai/exams/translate:
    post:
      tags: [AI]
      summary: Translate exam questions
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [questions, targetLanguage]
              properties:
                questions:
                  type: array
                  items:
                    type: object
                    additionalProperties: true
                targetLanguage:
                  type: string
      responses:
        '200':
          description: Translated
  /v1/ai/education-plans/generate:
    post:
      tags: [AI]
      summary: Generate education plan
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [documentId, name]
              properties:
                documentId: { type: string, format: uuid }
                name: { type: string }
                language: { type: string, default: en }
                periodMonths: { type: integer, minimum: 1, maximum: 24 }
                sessionsPerWeek: { type: integer, minimum: 1, maximum: 14 }
                hoursPerSession: { type: integer, minimum: 1, maximum: 8 }
      responses:
        '201':
          description: Generated
  /v1/ai/translate:
    post:
      tags: [AI]
      summary: Translate text
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [text, toLanguage]
              properties:
                text: { type: string }
                toLanguage: { type: string }
      responses:
        '200':
          description: Translated
  /v1/ai/tts:
    post:
      tags: [AI]
      summary: TTS placeholder
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [text]
              properties:
                text: { type: string }
      responses:
        '200':
          description: Placeholder response
  /v1/ai/stt:
    post:
      tags: [AI]
      summary: STT placeholder
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [text]
              properties:
                text: { type: string }
      responses:
        '200':
          description: Placeholder response
  /v1/ai/image/generate:
    post:
      tags: [AI]
      summary: Rewrite image prompt (phase-1)
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [prompt]
              properties:
                prompt: { type: string }
      responses:
        '200':
          description: Rewritten prompt
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    RegisterRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 8
        role:
          type: string
          enum: [admin, operator, user]
          default: user
    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 8
    AuthResponse:
      type: object
      properties:
        user:
          type: object
          properties:
            id: { type: string, format: uuid }
            email: { type: string, format: email }
            role: { type: string }
        tokens:
          type: object
          properties:
            accessToken: { type: string }
            refreshToken: { type: string }
            tokenType: { type: string, example: Bearer }
    CreateDocumentRequest:
      type: object
      required: [title, fileName, fileType, fileSize]
      properties:
        title: { type: string, minLength: 1, maxLength: 200 }
        fileName: { type: string }
        fileType: { type: string }
        fileSize: { type: integer, minimum: 0 }
        localPath: { type: string }
        metadata:
          type: object
          additionalProperties: true
    GenerateExamRequest:
      type: object
      properties:
        documentId:
          type: string
          format: uuid
        documentIds:
          type: array
          items:
            type: string
            format: uuid
        documentText:
          type: string
        title:
          type: string
        subject:
          type: string
        gradeLevel:
          type: string
        language:
          type: string
          default: en
        questionCount:
          type: integer
          minimum: 1
          maximum: 50
          default: 10
        topics:
          type: array
          items:
            type: string
        customPrompt:
          type: string
        questionTypes:
          type: array
          items:
            type: string
            enum: [multiple_choice, true_false, multiple_select, fill_blank]
        difficultyDistribution:
          type: object
          properties:
            easy: { type: integer, minimum: 0 }
            medium: { type: integer, minimum: 0 }
            hard: { type: integer, minimum: 0 }
